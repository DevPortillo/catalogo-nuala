<style>
:root {
    --accent: #c86fb8;
    --accent-soft: #f3c4e8;
    --accent-strong: #ff8fb3;
    --success: #4bd6a5;
    --danger: #ff4b6a;

    --bg: #fbf3f8;
    --surface: #ffffff;
    --surface-alt: #fbeef6;
    --border: #f0d9e8;
    --text: #2b1a26;
    --text-muted: #8a7690;
    --text-faint: #b79cb0;

    --radius: 16px;
    --shadow-sm: 0 2px 8px rgba(200, 111, 184, 0.10);
    --shadow-md: 0 16px 34px rgba(200, 111, 184, 0.22);
    --font-ui: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
}

html[data-theme="dark"] {
    --bg: #0f0c16;
    --surface: #181422;
    --surface-alt: #221d30;
    --border: #332c42;
    --text: #f7f3ea;
    --text-muted: #b7afc7;
    --text-faint: #6f6580;
    --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.45);
    --shadow-md: 0 18px 40px rgba(0, 0, 0, 0.55);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

::selection { background: var(--accent-strong); color: #ffffff; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 999px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--accent-strong); }
html { scrollbar-color: var(--accent) var(--bg); scrollbar-width: thin; }

body {
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background-image: radial-gradient(rgba(200, 111, 184, 0.05) 1px, transparent 1px);
    background-size: 22px 22px;
    pointer-events: none;
}

a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; }

.splash {
    position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(circle at 50% 30%, #2a1f2c 0%, #0f0c16 70%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    animation: splashOut 0.8s ease forwards;
    animation-delay: 2.6s;
}
.splash-logo {
    width: 120px; height: 120px; border-radius: 50%;
    box-shadow: 0 0 0 4px rgba(255,255,255,0.15), 0 20px 60px rgba(200,111,184,0.5);
    opacity: 0; transform: scale(0.6);
    animation: logoIn 0.9s cubic-bezier(.34,1.56,.64,1) forwards;
    animation-delay: 0.15s;
}
.splash-title {
    margin-top: 22px; font-size: 34px; font-weight: 800; letter-spacing: 0.12em;
    color: #ffffff; opacity: 0; transform: translateY(14px);
    animation: textIn 0.7s ease forwards;
    animation-delay: 1.05s;
}
.splash-tagline {
    margin-top: 6px; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--accent-soft); opacity: 0; transform: translateY(10px);
    animation: textIn 0.7s ease forwards;
    animation-delay: 1.5s;
}
@keyframes logoIn { to { opacity: 1; transform: scale(1); } }
@keyframes textIn { to { opacity: 1; transform: translateY(0); } }
@keyframes splashOut { to { opacity: 0; visibility: hidden; pointer-events: none; } }

.contenido { opacity: 0; animation: contenidoIn 0.8s ease forwards; animation-delay: 2.5s; }
@keyframes contenidoIn { to { opacity: 1; } }

.topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 30;
    flex-wrap: wrap;
}

.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14.5px; flex: 1; min-width: 200px; }
.brand img {
    width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
    box-shadow: 0 0 0 2px var(--border);
}
.brand span { letter-spacing: 0.02em; }
.brand span small { display: block; font-size: 10px; font-weight: 500; color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase; }

.topbar-actions { display: flex; align-items: center; gap: 10px; }

.theme-toggle {
    display: flex; align-items: center; gap: 4px;
    background: var(--surface-alt); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px;
}
.theme-toggle button {
    border: none; background: transparent; width: 30px; height: 30px;
    border-radius: 999px; display: flex; align-items: center; justify-content: center;
    color: var(--text-muted);
}
.theme-toggle button.active { background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: #fff; }

.hero {
    background: linear-gradient(135deg, #241f33, #0f0c16);
    color: #fff; padding: 30px 20px; margin: 16px; border-radius: 20px;
    position: relative; overflow: hidden;
}
.hero::before {
    content: ""; position: absolute; inset: -40%;
    background: radial-gradient(circle at 0% 0%, rgba(200,111,184,0.35) 0, transparent 55%),
                radial-gradient(circle at 100% 0%, rgba(255,143,179,0.28) 0, transparent 50%);
    pointer-events: none;
}
.hero h1 { font-size: 21px; margin: 0 0 6px; position: relative; }
.hero p { color: var(--accent-soft); margin: 0; font-size: 12.5px; position: relative; }

.toolbar-wrap { padding: 0 16px; display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }

.search-box { position: relative; flex: 1; min-width: 220px; }
.search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-faint); }
.search-box input {
    width: 100%; padding: 11px 12px 11px 38px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 13.5px;
}
.search-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(200,111,184,.18); }

.categoria-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 0 16px 30px;
}
@media (min-width: 620px) { .categoria-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 0 20px 32px; } }
@media (min-width: 900px) { .categoria-grid { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 1200px) { .categoria-grid { grid-template-columns: repeat(5, 1fr); } }

.categoria-tile {
    position: relative;
    aspect-ratio: 1/1;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    cursor: pointer;
    width: 100%;
    transition: transform .35s cubic-bezier(.22,1,.36,1), box-shadow .35s cubic-bezier(.22,1,.36,1), border-color .25s;
    opacity: 0; transform: translateY(10px);
    animation: cardIn .55s cubic-bezier(.22,1,.36,1) forwards;
}
.categoria-tile:hover { box-shadow: var(--shadow-md); transform: translateY(-4px) scale(1.015); border-color: var(--accent); }
@keyframes cardIn { to { opacity: 1; transform: translateY(0); } }

.tile-carrusel { position: absolute; inset: 0; }
.tile-slide {
    position: absolute; inset: 0; opacity: 0; transform: scale(1.05);
    transition: opacity .7s ease, transform .7s ease;
}
.tile-slide.activa { opacity: 1; transform: scale(1); }
.tile-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }

.tile-vacia {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--text-faint); background: var(--surface-alt);
}

.tile-flecha {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 4;
    width: 26px; height: 26px; border-radius: 50%; border: none;
    background: rgba(255,255,255,.82); color: var(--text);
    display: flex; align-items: center; justify-content: center;
}
.tile-flecha.izq { left: 6px; }
.tile-flecha.der { right: 6px; }

.categoria-tile .escrim {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 12px 10px; z-index: 3;
    background: linear-gradient(180deg, transparent, rgba(15,12,22,0.82));
    pointer-events: none;
}
.categoria-tile .nombre-cat {
    color: #ffffff; font-weight: 700; font-size: 12.5px; line-height: 1.3;
}
.categoria-tile .conteo {
    color: var(--accent-soft); font-size: 10.5px; margin-top: 2px; letter-spacing: .02em;
}

.sin-resultados { text-align: center; color: var(--text-faint); padding: 40px 20px; grid-column: 1 / -1; }

.carrusel-overlay {
    position: fixed; inset: 0; z-index: 60; background: rgba(15,12,22,.72);
    display: none; align-items: center; justify-content: center; padding: 16px;
}
.carrusel-overlay.open { display: flex; }

.carrusel-modal {
    background: var(--surface); border-radius: 20px; width: 100%; max-width: 440px;
    max-height: 92vh; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: var(--shadow-md);
    transform: scale(.94); opacity: 0; animation: modalIn .3s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes modalIn { to { transform: scale(1); opacity: 1; } }

.carrusel-header {
    padding: 16px 18px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
}
.carrusel-header h2 { margin: 0; font-size: 15px; }
.carrusel-header button {
    width: 30px; height: 30px; border-radius: 9px; border: none; background: var(--surface-alt);
    color: var(--text); display: flex; align-items: center; justify-content: center;
}

.carrusel-viewport {
    position: relative; width: 100%; aspect-ratio: 1/1; background: var(--surface-alt);
    overflow: hidden;
}
.carrusel-slide {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: scale(1.04); transition: opacity .5s ease, transform .5s ease;
    pointer-events: none;
}
.carrusel-slide.activa { opacity: 1; transform: scale(1); pointer-events: auto; }
.carrusel-slide img { width: 100%; height: 100%; object-fit: cover; }
.carrusel-slide .sin-foto-slide {
    display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; color: var(--text-faint);
}

.carrusel-flecha {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 5;
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.85); color: var(--text); display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-sm);
}
.carrusel-flecha.izquierda { left: 10px; }
.carrusel-flecha.derecha { right: 10px; }

.carrusel-info { padding: 16px 18px; text-align: center; }
.carrusel-info .precio-linea { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-bottom: 8px; }
.carrusel-info .precio-linea:last-child { margin-bottom: 0; }
.carrusel-info .precio-etiqueta { font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-faint); }
.carrusel-info .precio-slide { font-weight: 800; color: var(--success); font-size: 19px; }
.carrusel-info .precio-divisas { font-weight: 800; color: var(--accent-strong); font-size: 19px; }

.carrusel-puntos { display: flex; gap: 6px; justify-content: center; padding: 0 18px 16px; flex-wrap: wrap; }
.carrusel-puntos button {
    width: 7px; height: 7px; border-radius: 50%; border: none; background: var(--border); padding: 0;
}
.carrusel-puntos button.activo { background: var(--accent); width: 18px; border-radius: 999px; }

.footer-pd {
    text-align: center; color: var(--text-faint); font-size: 11px; line-height: 1.8; padding: 20px 16px 30px;
}
.footer-pd .version { font-family: var(--font-mono); font-size: 10px; }

@media (max-width: 480px) {
    .hero { margin: 12px; padding: 24px 16px; }
    .splash-logo { width: 96px; height: 96px; }
    .splash-title { font-size: 27px; }
    .carrusel-modal { max-width: 100%; }
}
</style>
</head>

<script>
let CATEGORIAS = [];

function formatearDinero(valor) {
    var numero = Number(valor) || 0;
    return '$ ' + numero.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

var tileEstados = {};
var tileTimers = {};
var TIEMPO_ROTACION_TILE = 5000;

function crearTarjetaCategoria(categoria, posicion) {
    var tile = document.createElement('div');
    tile.className = 'categoria-tile';
    tile.tabIndex = 0;
    tile.setAttribute('role', 'button');
    tile.setAttribute('aria-label', 'Ver categoria ' + categoria.nombre);
    tile.style.animationDelay = (Math.min(posicion, 24) * 0.035) + 's';

    var imagenes = categoria.modelos.map(function (m) { return m.imagen; }).filter(Boolean);

    var carruselHtml = '<div class="tile-carrusel" id="tileCarrusel-' + categoria.id + '">';
    if (imagenes.length === 0) {
        carruselHtml += '<div class="tile-vacia"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>';
    } else {
        imagenes.forEach(function (src, i) {
            carruselHtml += '<div class="tile-slide' + (i === 0 ? ' activa' : '') + '" data-index="' + i + '"><img src="' + src + '" alt="' + categoria.nombre + '"></div>';
        });
    }
    carruselHtml += '</div>';

    var flechasHtml = '';
    if (imagenes.length > 1) {
        flechasHtml =
            '<button type="button" class="tile-flecha izq" aria-label="Modelo anterior">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="15 18 9 12 15 6"/></svg></button>' +
            '<button type="button" class="tile-flecha der" aria-label="Siguiente modelo">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="9 18 15 12 9 6"/></svg></button>';
    }

    tile.innerHTML =
        carruselHtml + flechasHtml +
        '<div class="escrim">' +
        '<div class="nombre-cat">' + categoria.nombre + '</div>' +
        '<div class="conteo">' + categoria.modelos.length + (categoria.modelos.length === 1 ? ' modelo' : ' modelos') + '</div>' +
        '</div>';

    tileEstados[categoria.id] = { indice: 0, total: imagenes.length };

    if (imagenes.length > 1) {
        tile.querySelector('.tile-flecha.izq').addEventListener('click', function (evento) {
            evento.stopPropagation();
            tileMoverSlide(categoria.id, -1);
            tileReiniciarRotacion(categoria.id);
        });
        tile.querySelector('.tile-flecha.der').addEventListener('click', function (evento) {
            evento.stopPropagation();
            tileMoverSlide(categoria.id, 1);
            tileReiniciarRotacion(categoria.id);
        });
        tileIniciarRotacion(categoria.id);
    }

    tile.addEventListener('click', function () { abrirCarrusel(categoria.id); });
    tile.addEventListener('keydown', function (evento) {
        if (evento.key === 'Enter' || evento.key === ' ') {
            evento.preventDefault();
            abrirCarrusel(categoria.id);
        }
    });

    return tile;
}

function tileMoverSlide(categoriaId, delta) {
    var estado = tileEstados[categoriaId];
    if (!estado || estado.total <= 1) return;
    estado.indice = (estado.indice + delta + estado.total) % estado.total;

    var contenedor = document.getElementById('tileCarrusel-' + categoriaId);
    if (!contenedor) return;
    contenedor.querySelectorAll('.tile-slide').forEach(function (slide) {
        slide.classList.toggle('activa', parseInt(slide.dataset.index, 10) === estado.indice);
    });
}

function tileIniciarRotacion(categoriaId) {
    tileTimers[categoriaId] = setInterval(function () {
        tileMoverSlide(categoriaId, 1);
    }, TIEMPO_ROTACION_TILE);
}

function tileReiniciarRotacion(categoriaId) {
    if (tileTimers[categoriaId]) {
        clearInterval(tileTimers[categoriaId]);
    }
    tileIniciarRotacion(categoriaId);
}

function limpiarTimersTiles() {
    Object.keys(tileTimers).forEach(function (id) {
        clearInterval(tileTimers[id]);
    });
    tileTimers = {};
    tileEstados = {};
}

function renderizarCategorias(filtro) {
    limpiarTimersTiles();
    var grilla = document.getElementById('grillaCategorias');
    grilla.innerHTML = '';
    var termino = (filtro || '').toLowerCase().trim();

    var visibles = CATEGORIAS.filter(function (categoria) {
        if (termino === '') return true;
        return categoria.nombre.toLowerCase().indexOf(termino) !== -1;
    });

    if (visibles.length === 0) {
        var vacio = document.createElement('p');
        vacio.className = 'sin-resultados';
        vacio.textContent = 'No se encontraron categorias.';
        grilla.appendChild(vacio);
        return;
    }

    visibles.forEach(function (categoria, indice) {
        grilla.appendChild(crearTarjetaCategoria(categoria, indice));
    });
}

var categoriaActivaId = null;
var indiceSlideActivo = 0;
var temporizadorCarrusel = null;
var TIEMPO_ROTACION = 3200;

function obtenerCategoriaActiva() {
    return CATEGORIAS.find(function (c) { return c.id === categoriaActivaId; });
}

function renderizarSlide() {
    var categoria = obtenerCategoriaActiva();
    if (!categoria) return;
    var modelo = categoria.modelos[indiceSlideActivo];

    var viewport = document.getElementById('carruselViewport');
    var slidesViejos = viewport.querySelectorAll('.carrusel-slide');
    slidesViejos.forEach(function (s) { s.remove(); });

    var slide = document.createElement('div');
    slide.className = 'carrusel-slide activa';
    slide.innerHTML = modelo.imagen
        ? '<img src="' + modelo.imagen + '" alt="' + categoria.nombre + '">'
        : '<div class="sin-foto-slide"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>';

    viewport.prepend(slide);

    var flechaIzq = document.getElementById('btnCarruselAnterior');
    var flechaDer = document.getElementById('btnCarruselSiguiente');

    document.getElementById('carruselPrecio').textContent = formatearDinero(modelo.precio);
    document.getElementById('carruselPrecioDivisas').textContent = formatearDinero(modelo.precioDivisas);
    document.getElementById('carruselTitulo').textContent = categoria.nombre;

    var puntosContenedor = document.getElementById('carruselPuntos');
    puntosContenedor.innerHTML = '';
    categoria.modelos.forEach(function (m, i) {
        var punto = document.createElement('button');
        punto.type = 'button';
        punto.className = i === indiceSlideActivo ? 'activo' : '';
        punto.addEventListener('click', function () {
            indiceSlideActivo = i;
            renderizarSlide();
            reiniciarRotacion();
        });
        puntosContenedor.appendChild(punto);
    });

    var flechasOcultas = categoria.modelos.length <= 1;
    flechaIzq.style.display = flechasOcultas ? 'none' : 'flex';
    flechaDer.style.display = flechasOcultas ? 'none' : 'flex';
}

function siguienteSlide() {
    var categoria = obtenerCategoriaActiva();
    if (!categoria) return;
    indiceSlideActivo = (indiceSlideActivo + 1) % categoria.modelos.length;
    renderizarSlide();
}

function anteriorSlide() {
    var categoria = obtenerCategoriaActiva();
    if (!categoria) return;
    indiceSlideActivo = (indiceSlideActivo - 1 + categoria.modelos.length) % categoria.modelos.length;
    renderizarSlide();
}

function iniciarRotacion() {
    detenerRotacion();
    var categoria = obtenerCategoriaActiva();
    if (!categoria || categoria.modelos.length <= 1) return;
    temporizadorCarrusel = setInterval(siguienteSlide, TIEMPO_ROTACION);
}

function detenerRotacion() {
    if (temporizadorCarrusel) {
        clearInterval(temporizadorCarrusel);
        temporizadorCarrusel = null;
    }
}

function reiniciarRotacion() {
    iniciarRotacion();
}

function abrirCarrusel(categoriaId) {
    categoriaActivaId = categoriaId;
    indiceSlideActivo = 0;
    renderizarSlide();
    document.getElementById('carruselOverlay').classList.add('open');
    iniciarRotacion();
}

function cerrarCarrusel() {
    document.getElementById('carruselOverlay').classList.remove('open');
    detenerRotacion();
    categoriaActivaId = null;
}

function alternarTema(tema) {
    document.documentElement.setAttribute('data-theme', tema);
    localStorage.setItem('pd_theme_nuala', tema);
    document.querySelectorAll('.theme-toggle button').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.tema === tema);
    });
}

document.addEventListener('DOMContentLoaded', function () {
    fetch('/.netlify/functions/get-datos')
        .then(function (respuesta) { return respuesta.json(); })
        .then(function (datos) {
            CATEGORIAS = Array.isArray(datos) ? datos : [];
            renderizarCategorias('');
        })
        .catch(function () {
            var grilla = document.getElementById('grillaCategorias');
            grilla.innerHTML = '<p class="sin-resultados">No fue posible cargar el catalogo. Intenta de nuevo mas tarde.</p>';
        });

    document.getElementById('buscador').addEventListener('input', function () {
        renderizarCategorias(this.value);
    });

    document.getElementById('btnCerrarCarrusel').addEventListener('click', cerrarCarrusel);
    document.getElementById('carruselOverlay').addEventListener('click', function (evento) {
        if (evento.target === this) cerrarCarrusel();
    });
    document.getElementById('btnCarruselSiguiente').addEventListener('click', function () {
        siguienteSlide();
        reiniciarRotacion();
    });
    document.getElementById('btnCarruselAnterior').addEventListener('click', function () {
        anteriorSlide();
        reiniciarRotacion();
    });

    var viewportTactil = document.getElementById('carruselViewport');
    var inicioX = null;
    viewportTactil.addEventListener('touchstart', function (e) { inicioX = e.touches[0].clientX; }, { passive: true });
    viewportTactil.addEventListener('touchend', function (e) {
        if (inicioX === null) return;
        var deltaX = e.changedTouches[0].clientX - inicioX;
        if (Math.abs(deltaX) > 40) {
            if (deltaX < 0) { siguienteSlide(); } else { anteriorSlide(); }
            reiniciarRotacion();
        }
        inicioX = null;
    }, { passive: true });

    document.addEventListener('keydown', function (e) {
        if (!document.getElementById('carruselOverlay').classList.contains('open')) return;
        if (e.key === 'Escape') cerrarCarrusel();
        if (e.key === 'ArrowRight') { siguienteSlide(); reiniciarRotacion(); }
        if (e.key === 'ArrowLeft') { anteriorSlide(); reiniciarRotacion(); }
    });

    var temaActual = document.documentElement.getAttribute('data-theme') || 'light';
    document.querySelectorAll('.theme-toggle button').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.tema === temaActual);
        btn.addEventListener('click', function () { alternarTema(btn.dataset.tema); });
    });
});
</script>
</body>
</html>
